<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الخريطة التفاعلية - بوصلة</title>
  <meta name="description" content="خريطة تفاعلية لمعامل الدور الأرضي مع رسم المسار">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="map-page">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand"><img src="logo.svg" alt="شعار بوصلة"><span>بوصلة</span></a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html"><i class="fa-solid fa-house"></i>الرئيسية</a>
        <a href="labs.html"><i class="fa-solid fa-door-open"></i>المعامل</a>
        <a href="map.html" class="active" aria-current="page"><i class="fa-solid fa-map-location-dot"></i>الخريطة</a>
        <a href="video.html"><i class="fa-solid fa-circle-play"></i>الفيديو التعريفي</a>
        <a href="about.html"><i class="fa-solid fa-compass"></i>عن بوصلة</a>
        <a href="help.html"><i class="fa-solid fa-circle-question"></i>مساعدة</a>
      </nav>
      <form class="search-box" id="searchForm" role="search">
        <input type="search" id="searchInput" placeholder="ابحث برقم المعمل (مثال: 31)" aria-label="ابحث برقم المعمل">
        <button type="submit" aria-label="بحث"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>
      <button class="menu-toggle" type="button" aria-label="القائمة" aria-controls="mainNav" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <div class="map-viewport" id="mapViewport">
    <svg id="svgMap" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
      <image href="map.jpg" x="0" y="0" width="1000" height="600" preserveAspectRatio="none"/>

      <g id="roomsGroup"></g>

      <g id="navigationPathGroup">
        <path id="routePathShadow" d="" fill="none" stroke="#145a41" stroke-width="8" opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="routePath" d="" fill="none" stroke="#2fa676" stroke-width="4.5" class="animated-route" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g id="startMarker">
        <circle r="16" fill="#e74c3c" opacity="0.25" class="ping-circle"/>
        <circle r="10" fill="#e74c3c"/>
        <path d="M -4 -4 L 4 4 M 4 -4 L -4 4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <g id="destinationMarker" transform="translate(-100, -100)">
        <circle r="14" fill="#2fa676" opacity="0.3" class="ping-circle"/>
        <path d="M 0 0 L -8 -20 A 10 10 0 1 1 8 -20 Z" fill="#145a41" stroke="#ffffff" stroke-width="2"/>
        <circle cy="-20" r="3" fill="#ffffff"/>
      </g>
    </svg>

    <div class="map-ui map-toolbar">
      <label class="map-chip">
        <i class="fa-solid fa-door-open" style="color: var(--green-600)"></i>
        <span>اختاري المعمل</span>
        <select id="roomSelect" aria-label="اختاري المعمل">
          <option value="">—</option>
        </select>
      </label>
      <div class="map-chip">
        <span class="dot dot-start"></span> نقطة البداية (X)
        <span class="dot dot-room"></span> المعامل
      </div>
    </div>

    <div class="map-ui route-banner" id="routeBanner">
      <i class="fa-solid fa-person-walking"></i>
      <span id="routeBannerText">اتبعي المسار الأخضر</span>
    </div>

    <div class="map-ui zoom-controls">
      <button id="zoomInBtn" type="button" title="تكبير" aria-label="تكبير"><i class="fa-solid fa-plus"></i></button>
      <button id="zoomOutBtn" type="button" title="تصغير" aria-label="تصغير"><i class="fa-solid fa-minus"></i></button>
      <button id="resetViewBtn" type="button" title="عرض الخريطة كاملة" aria-label="عرض الخريطة كاملة"><i class="fa-solid fa-expand"></i></button>
    </div>

    <div class="map-ui room-card" id="roomCard">
      <div class="room-card-head">
        <img id="cardRoomImg" src="" alt="">
        <div>
          <h3 id="cardRoomTitle">معمل</h3>
          <p>الدور الأرضي</p>
        </div>
        <button class="room-card-close" id="closeRoomCard" type="button" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="room-stats">
        <div><span>المسافة التقريبية</span><strong id="navDistance">--</strong></div>
        <div><span>وقت المشي</span><strong id="navTime">--</strong></div>
      </div>
      <div class="room-card-actions">
        <button id="startNavigationBtn" class="btn" type="button"><i class="fa-solid fa-route"></i>ابدأ المسار</button>
        <a id="cardRoomLink" href="#" class="btn btn-outline">صفحة المعمل</a>
      </div>
    </div>
  </div>

  <script src="site.js"></script>
  <script>
    // ---------- إحداثيات الخريطة (بنظام 1000 × 600) ----------
    const CORRIDOR_Y = 418;           // الممر الرئيسي
    const START = { x: 172, y: CORRIDOR_Y };
    const WALKWAY_A = 331;            // الممر بين معامل 30/31 و 43/44
    const WALKWAY_B = 437;            // الممر بجانب معامل 58/61

    const ROOMS = [
      { id: 'G-30', lab: '30', rect: [282, 247, 41, 51], path: [[WALKWAY_A, CORRIDOR_Y], [WALKWAY_A, 272], [323, 272]] },
      { id: 'G-31', lab: '31', rect: [282, 303, 41, 51], path: [[WALKWAY_A, CORRIDOR_Y], [WALKWAY_A, 328], [323, 328]] },
      { id: 'G-43', lab: '43', rect: [339, 247, 41, 51], path: [[WALKWAY_A, CORRIDOR_Y], [WALKWAY_A, 272], [339, 272]] },
      { id: 'G-44', lab: '44', rect: [339, 303, 41, 51], path: [[WALKWAY_A, CORRIDOR_Y], [WALKWAY_A, 328], [339, 328]] },
      { id: 'G-58', lab: '58', rect: [444, 280, 42, 48], path: [[WALKWAY_B, CORRIDOR_Y], [WALKWAY_B, 304], [444, 304]] },
      { id: 'G-61', lab: '61', rect: [444, 332, 42, 38], path: [[WALKWAY_B, CORRIDOR_Y], [WALKWAY_B, 351], [444, 351]] },
      { id: 'G-72', lab: '72', rect: [495, 342, 41, 26], path: [[WALKWAY_B, CORRIDOR_Y], [WALKWAY_B, 337], [491, 337], [491, 355], [495, 355]] }
    ].map(r => ({
      ...r,
      name: `معمل ${r.lab}`,
      cx: r.rect[0] + r.rect[2] / 2,
      cy: r.rect[1] + r.rect[3] / 2,
      points: [START, ...r.path.map(([x, y]) => ({ x, y }))]
    }));

    const PX_TO_METERS = 0.3;   // تقدير تقريبي لمقياس الرسم
    const WALK_SPEED = 1.3;     // متر في الثانية

    const viewport = document.getElementById('mapViewport');
    const svg = document.getElementById('svgMap');
    const roomsGroup = document.getElementById('roomsGroup');
    const roomSelect = document.getElementById('roomSelect');
    const roomCard = document.getElementById('roomCard');
    const routePath = document.getElementById('routePath');
    const routePathShadow = document.getElementById('routePathShadow');
    const destinationMarker = document.getElementById('destinationMarker');
    const routeBanner = document.getElementById('routeBanner');
    const SVG_NS = 'http://www.w3.org/2000/svg';

    let scale = 1, panX = 0, panY = 0, fitScale = 1;
    let selectedRoom = null;

    document.getElementById('startMarker').setAttribute('transform', `translate(${START.x}, ${START.y})`);

    // ---------- رسم المعامل ----------
    ROOMS.forEach(room => {
      const [x, y, w, h] = room.rect;
      const rect = document.createElementNS(SVG_NS, 'rect');
      Object.entries({ x, y, width: w, height: h, rx: 2 }).forEach(([k, v]) => rect.setAttribute(k, v));
      rect.setAttribute('class', 'room-polygon');
      rect.dataset.id = room.id;
      const title = document.createElementNS(SVG_NS, 'title');
      title.textContent = room.name;
      rect.appendChild(title);
      roomsGroup.appendChild(rect);

      const opt = document.createElement('option');
      opt.value = room.id;
      opt.textContent = `${room.name} (${room.id})`;
      roomSelect.appendChild(opt);
    });

    // ---------- التكبير والتحريك ----------
    function apply(animate = false) {
      svg.classList.toggle('animate', animate);
      svg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function fitMap(animate = false) {
      const w = viewport.clientWidth, h = viewport.clientHeight;
      fitScale = Math.min(w / 1000, h / 600);
      scale = fitScale;
      panX = (w - 1000 * scale) / 2;
      panY = (h - 600 * scale) / 2;
      apply(animate);
    }

    function zoomAt(factor, cx, cy) {
      const newScale = Math.min(Math.max(fitScale * 0.8, scale * factor), fitScale * 6);
      panX = cx - (cx - panX) * (newScale / scale);
      panY = cy - (cy - panY) * (newScale / scale);
      scale = newScale;
      apply();
    }

    function focusOn(x, y) {
      scale = Math.max(fitScale * 2.2, 1.4);
      panX = viewport.clientWidth / 2 - x * scale;
      panY = viewport.clientHeight / 2 - y * scale;
      apply(true);
    }

    // سحب بالماوس أو بإصبع واحد، وتكبير بإصبعين
    const pointers = new Map();
    let lastPinch = null, moved = 0;

    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.map-ui')) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = 0;
      viewport.classList.add('dragging');
    });

    window.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        panX += e.clientX - prev.x;
        panY += e.clientY - prev.y;
        moved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
        apply();
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        const rect = viewport.getBoundingClientRect();
        const mid = { x: (a.x + b.x) / 2 - rect.left, y: (a.y + b.y) / 2 - rect.top };
        if (lastPinch) zoomAt(dist / lastPinch, mid.x, mid.y);
        lastPinch = dist;
        moved = 100;
      }
    });

    const endPointer = (e) => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) lastPinch = null;
      if (pointers.size === 0) viewport.classList.remove('dragging');
    };
    window.addEventListener('pointerup', endPointer);
    window.addEventListener('pointercancel', endPointer);

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      zoomAt(e.deltaY < 0 ? 1.15 : 0.87, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    const center = () => [viewport.clientWidth / 2, viewport.clientHeight / 2];
    document.getElementById('zoomInBtn').addEventListener('click', () => zoomAt(1.3, ...center()));
    document.getElementById('zoomOutBtn').addEventListener('click', () => zoomAt(0.77, ...center()));
    document.getElementById('resetViewBtn').addEventListener('click', () => fitMap(true));
    window.addEventListener('resize', () => selectedRoom ? focusOn(selectedRoom.cx, selectedRoom.cy) : fitMap());

    // ---------- اختيار المعمل ورسم المسار ----------
    function pathLength(points) {
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        total += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      }
      return total;
    }

    function selectRoom(id) {
      const room = ROOMS.find(r => r.id === id);
      if (!room) return;
      selectedRoom = room;
      roomSelect.value = room.id;

      document.querySelectorAll('.room-polygon').forEach(el => el.classList.toggle('room-selected', el.dataset.id === room.id));

      const meters = Math.round(pathLength(room.points) * PX_TO_METERS);
      document.getElementById('cardRoomTitle').textContent = `${room.name} · ${room.id}`;
      document.getElementById('navDistance').textContent = `${meters} متر`;
      document.getElementById('navTime').textContent = `${Math.max(1, Math.round(meters / WALK_SPEED / 60 * 10) / 10)} دقيقة`;
      document.getElementById('cardRoomImg').src = `${room.lab}.jpg`;
      document.getElementById('cardRoomImg').alt = `باب ${room.name}`;
      document.getElementById('cardRoomLink').href = `lab${room.lab}.html`;
      roomCard.classList.add('show');

      clearRoute();
      focusOn(room.cx, room.cy);
    }

    function startNavigation() {
      if (!selectedRoom) return;
      const d = selectedRoom.points.map((p, i) => `${i ? 'L' : 'M'} ${p.x} ${p.y}`).join(' ');
      routePath.setAttribute('d', d);
      routePathShadow.setAttribute('d', d);
      const last = selectedRoom.points[selectedRoom.points.length - 1];
      destinationMarker.setAttribute('transform', `translate(${last.x}, ${last.y})`);
      document.getElementById('routeBannerText').textContent = `اتبعي المسار الأخضر من (X) إلى ${selectedRoom.name}`;
      routeBanner.classList.add('show');

      // نعرض المسار كاملًا من البداية حتى المعمل
      const midX = (START.x + last.x) / 2, midY = (START.y + last.y) / 2 - 20;
      scale = Math.max(fitScale * 1.6, 1);
      panX = viewport.clientWidth / 2 - midX * scale;
      panY = viewport.clientHeight / 2 - midY * scale;
      apply(true);
    }

    function clearRoute() {
      routePath.setAttribute('d', '');
      routePathShadow.setAttribute('d', '');
      destinationMarker.setAttribute('transform', 'translate(-100, -100)');
      routeBanner.classList.remove('show');
    }

    roomsGroup.addEventListener('click', (e) => {
      if (moved > 6) return; // تجاهل النقر إذا كان المستخدم يسحب الخريطة
      const id = e.target.dataset && e.target.dataset.id;
      if (id) selectRoom(id);
    });
    roomSelect.addEventListener('change', () => roomSelect.value && selectRoom(roomSelect.value));
    document.getElementById('startNavigationBtn').addEventListener('click', startNavigation);
    document.getElementById('closeRoomCard').addEventListener('click', () => {
      roomCard.classList.remove('show');
      document.querySelectorAll('.room-polygon').forEach(el => el.classList.remove('room-selected'));
      roomSelect.value = '';
      selectedRoom = null;
      clearRoute();
      fitMap(true);
    });

    // ---------- فتح المعمل القادم من الرابط (map.html?room=G-31 أو ?lab=31) ----------
    fitMap();
    const params = new URLSearchParams(location.search);
    const fromUrl = normalizeLabQuery(params.get('room') || params.get('lab') || '');
    if (fromUrl) {
      selectRoom(`G-${fromUrl}`);
      setTimeout(startNavigation, 500);
    }
  </script>
</body>
</html>
